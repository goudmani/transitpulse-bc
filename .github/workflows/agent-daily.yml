name: Daily Ops Agent

# 03:30 UTC, an hour and ten minutes after the 02:20 ETL kicks off. That gap is
# deliberate: running before the ETL finishes would report every day as "no ETL
# execution found" and the agent would cry wolf every single morning.
#
# Scheduled workflows only ever run from the DEFAULT branch, so this file has to
# be merged to main before the cron will fire. On dev it will only run manually.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      fail_on_critical:
        description: "Exit non-zero if a critical finding is found"
        type: boolean
        default: false

permissions:
  contents: write # commit the report back to reports/
  pull-requests: write # open a draft PR when the code agent proposes a patch
  id-token: write # exchange the workflow token for AWS creds via OIDC

# A run that overruns its schedule must not collide with the next one -- two
# agents writing the same reports/<date>.md would race on the commit.
concurrency:
  group: daily-ops-agent
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt

      - name: Install dependencies
        run: pip install -r requirements-agent.txt

      # configure-aws-credentials reports a missing role-to-assume as the generic
      # "Could not load credentials from any providers", which sends you looking
      # at IAM and OIDC when the actual cause is an unset repository secret.
      # Three lines here save that entire detour.
      - name: Check required secrets are set
        run: |
          missing=""
          [ -n "${{ secrets.AGENT_ROLE_ARN }}" ] || missing="$missing AGENT_ROLE_ARN"
          [ -n "${{ secrets.GROQ_API_KEY }}" ]   || missing="$missing GROQ_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Set these under Settings -> Secrets and variables -> ACTIONS (not the Agents or Codespaces tab):$missing"
            exit 1
          fi

          # Validate the ARN's shape here rather than letting STS reject it.
          # AWS answers "Not authorized to perform sts:AssumeRoleWithWebIdentity"
          # for a malformed or non-existent role exactly as it does for a refused
          # one, so a stray newline in the secret looks identical to a broken
          # trust policy and sends you debugging IAM for an afternoon.
          # The value stays masked, but its length and shape are not the secret
          # and print fine. Those two facts distinguish "wrong ARN" from "wrong
          # trust policy", which the STS error deliberately does not.
          ARN='${{ secrets.AGENT_ROLE_ARN }}'
          LEN=${#ARN}
          case "$ARN" in
            arn:aws:iam::[0-9][0-9]*:role/*) SHAPE=ok ;;
            *) SHAPE=bad ;;
          esac
          case "$ARN" in
            *[[:space:]]*) SHAPE=whitespace ;;
          esac

          if [ "$SHAPE" != "ok" ]; then
            echo "::error title=AGENT_ROLE_ARN is malformed::length=$LEN, problem=$SHAPE. It must be exactly 'arn:aws:iam::<account>:role/<name>' with no leading or trailing whitespace. Regenerate with: aws iam get-role --role-name github-actions-transitpulse-agent --query Role.Arn --output text | tr -d '\n' | pbcopy"
            exit 1
          fi
          echo "required secrets present; AGENT_ROLE_ARN length=$LEN, shape ok"

      # TEMPORARY DIAGNOSTIC -- delete once OIDC is confirmed working.
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity" is returned
      # both for a refused role and for a role that does not exist, so the error
      # alone cannot tell you whether the trust policy is wrong or the ARN is.
      # These two facts settle it: the `sub` claim is what AWS matches against,
      # and the ARN's length exposes the trailing newline a copy-paste adds.
      - name: Diagnose OIDC
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # JWT payload is base64url without padding; add it back before decoding.
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "--- claims AWS will match against ---"
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, repository_owner, ref}'

          ARN='${{ secrets.AGENT_ROLE_ARN }}'
          echo "--- AGENT_ROLE_ARN shape ---"
          echo "length: ${#ARN}  (expected 64)"
          case "$ARN" in
            *[[:space:]]*) echo "::error::ARN contains whitespace or a newline" ;;
            arn:aws:iam::*:role/*) echo "format: looks like a role ARN" ;;
            *) echo "::error::does not look like a role ARN at all" ;;
          esac

      # Read-only role, deliberately not the PowerUserAccess deploy role used by
      # the Terraform workflow. The agent inspects; it never changes anything.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AGENT_ROLE_ARN }}
          aws-region: ca-central-1
          role-session-name: transitpulse-daily-agent

      - name: Run the agent
        id: agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Tracing degrades gracefully: with no LANGSMITH_API_KEY secret the
          # agent turns tracing off and runs exactly as before, so a missing or
          # expired key never fails the nightly run.
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: transitpulse-ops-agent
          # Only needed on the EU instance; harmless to leave unset otherwise.
          LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
          AWS_REGION: ca-central-1
          DAILY_COST_THRESHOLD: "1.50"
          MONTHLY_COST_THRESHOLD: "45.00"
          TARGET_COLLECTION_DAYS: "21"
          # Flip to true once the Project tag is activated under
          # Billing -> Cost allocation tags. Until then a tag filter returns $0.
          COST_FILTER_BY_TAG: "false"
        run: python -m agent.supervisor --verbose

      # The report is committed even when findings are critical -- especially
      # then. A day with no report in reports/ is indistinguishable from a day
      # the pipeline was fine, which is the failure mode this whole thing exists
      # to avoid.
      - name: Commit the report
        run: |
          git config user.name  "transitpulse-agent[bot]"
          git config user.email "transitpulse-agent[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "no report changes to commit"
          else
            git commit -m "report: daily ops check ${{ github.run_id }} (${{ steps.agent.outputs.status }})"
            # Rebase rather than force: a human may have pushed while this ran,
            # and the report is never the more important of the two changes.
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Patches are opened as a DRAFT pull request on their own branch. They are
      # never pushed to the default branch and never auto-merged: this agent
      # proposes code changes, a human decides.
      #
      # The branch prefix matters -- auto-release.yml only fires on merges whose
      # head ref is exactly 'dev', so an agent branch cannot cut a release.
      - name: Open a draft PR for proposed patches
        if: steps.agent.outputs.has_patches == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="agent/patches-$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git checkout -b "$BRANCH"

          applied=0
          for patch in reports/patches/$(date -u +%Y-%m-%d)-*.patch; do
            [ -e "$patch" ] || continue
            # --check first: a diff written against a file the model misread will
            # not apply, and a half-applied patch is worse than a skipped one.
            if git apply --check "$patch" 2>/dev/null; then
              git apply "$patch" && applied=$((applied + 1))
              echo "applied $patch"
            else
              echo "SKIPPED (does not apply cleanly): $patch"
            fi
          done

          if [ "$applied" -eq 0 ]; then
            echo "no patches applied cleanly; the proposals are in the report instead"
            exit 0
          fi

          git add -A
          git commit -m "agent: $applied proposed fix(es) from the $(date -u +%Y-%m-%d) run"
          git push origin "$BRANCH"

          # Heredoc rather than a multi-line --body argument: an unindented
          # continuation line inside a `run: |` block terminates the YAML block
          # scalar and breaks the whole workflow file.
          cat > /tmp/pr-body.md <<'EOF'
          Opened automatically by the daily ops agent.

          **Every change here is a proposal and none of it has been reviewed.**

          Read the report first, then this diff. Close the PR if the diagnosis is
          wrong -- that is the expected outcome most of the time.
          EOF
          {
            echo ""
            echo "- Report: \`${{ steps.agent.outputs.report_path }}\`"
            echo "- Trace: ${{ steps.agent.outputs.trace_url }}"
          } >> /tmp/pr-body.md

          gh pr create \
            --draft \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --title "agent: proposed fixes from $(date -u +%Y-%m-%d)" \
            --body-file /tmp/pr-body.md

      - name: Flag critical findings
        if: steps.agent.outputs.critical != '0'
        run: |
          echo "::warning title=TransitPulse::${{ steps.agent.outputs.critical }} critical finding(s) — see ${{ steps.agent.outputs.report_path }}"
          if [ "${{ inputs.fail_on_critical }}" = "true" ]; then exit 1; fi
