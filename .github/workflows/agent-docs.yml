name: Docs Agent

# 15:30 UTC, twelve hours after the ops agent. Later on purpose: Cost Explorer
# lags roughly 24h and the nightly ETL lands silver at ~02:20 UTC, so a mid-
# afternoon run describes a settled day rather than a partial one.
#
# Scheduled workflows only run from the DEFAULT branch, so this file has to be
# merged to main before the cron fires.
on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      skip_charts:
        description: "Update the marked blocks only, do not redraw charts"
        type: boolean
        default: false

permissions:
  contents: write # commit the refreshed README, charts and drift report
  id-token: write # OIDC for the read-only AWS role

concurrency:
  group: docs-agent
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt

      - name: Install dependencies
        run: pip install -r requirements-agent.txt

      - name: Check required secrets are set
        run: |
          missing=""
          [ -n "${{ secrets.AGENT_ROLE_ARN }}" ] || missing="$missing AGENT_ROLE_ARN"
          [ -n "${{ secrets.GROQ_API_KEY }}" ]   || missing="$missing GROQ_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Set these under Settings -> Secrets and variables -> ACTIONS (not Agents or Codespaces):$missing"
            exit 1
          fi

      # Same read-only role as the ops agent. This job writes to the repository,
      # never to AWS: the figures come from Athena and Cost Explorer reads.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AGENT_ROLE_ARN }}
          aws-region: ca-central-1
          role-session-name: transitpulse-docs-agent

      - name: Refresh README figures and charts
        id: docs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: transitpulse-ops-agent
          LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
          AWS_REGION: ca-central-1
        run: |
          python -m agent.docs_updater --verbose \
            ${{ inputs.skip_charts && '--skip-charts' || '' }}

      # README, regenerated charts and any drift report. Charts are binary, so
      # `git diff --staged --quiet` is what decides whether anything changed --
      # matplotlib can produce a byte-identical PNG from identical data, and a
      # commit per day regardless would be pure noise in the history.
      - name: Commit refreshed docs
        run: |
          git config user.name  "transitpulse-agent[bot]"
          git config user.email "transitpulse-agent[bot]@users.noreply.github.com"
          git add README.md img/ reports/
          if git diff --staged --quiet; then
            echo "nothing changed today"
          else
            git commit -m "docs: refresh README figures and charts (${{ github.run_id }})"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Drift is reported, never auto-corrected. A sentence is an argument, and
      # rewriting one should be a human decision.
      - name: Flag prose drift
        if: steps.docs.outputs.has_drift == 'true'
        run: |
          echo "::warning title=README drift::Claims in the README contradict live facts — see reports/$(date -u +%Y-%m-%d)-docs-drift.md"
